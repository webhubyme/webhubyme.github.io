    <style>

           NOTIFICATION
        ===================================================== */

        #notification {
            display: none;

            position: fixed;

            right: 20px;

            top: 20px;

            width: 350px;

            max-width: calc(100% - 40px);

            background: white;

            border-radius: 15px;

                0 15px 45px rgba(0, 0, 0, 0.20);

            border-left: 5px solid #814d68;

            z-index: 9999;

            animation:
                notificationIn 0.3s ease;
        }


        @keyframes notificationIn {

            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }

        .notification-close {
            position: absolute;

            right: 10px;

            font-size: 22px;

            color: #888;

        }


        #notification h3 {
            color: #814d68;

            font-size: 18px;

        }


        #notificationContent {

        }

            }


            .stats {
                grid-template-columns: 1fr;
            }


            .new-booking-bar {
                flex-direction: column;

                align-items: stretch;
            }


            .new-actions {
                flex-direction: column;
            }


            .new-actions button {
                width: 100%;
            }


            .section-header {

                align-items: stretch;

                gap: 10px;
            }


            .refresh-button {
                width: 100%;
            }


            .booking-info {
                grid-template-columns: 1fr;
            }


            .booking-actions {
                flex-direction: column;
            }


            .confirm-button,
            .reject-button {
                width: 100%;
            }


            #notification {
                left: 15px;

                right: 15px;

                top: 15px;

                width: auto;

                max-width: none;
            }

        }


    </style>

</head>

<script>


/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
    "https://fzvafnmtxsyftumhwptj.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_YKbRYshLW19oh7LlUKiVSQ_onviKmTs";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let allBookings = [];

let knownBookingIds = new Set();

let newBookingIds = new Set();

let pollingTimer = null;

let firstLoad = true;



const STORAGE_KEY =
    "alwan_alward_seen_bookings";



/* =====================================================
   GET SEEN BOOKINGS
===================================================== */

function getSeenBookingIds() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);


        if (!saved) {

            return new Set();

        }


        return new Set(
            JSON.parse(saved)
        );

    }

    catch (error) {

        console.error(
            "Could not read saved bookings:",
            error
        );

        return new Set();

    }

}



/* =====================================================
   SAVE SEEN BOOKINGS
===================================================== */

function saveSeenBookingIds(ids) {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                Array.from(ids)
            )
        );

    }

    catch (error) {

        console.error(
            "Could not save bookings:",
            error
        );

    }

}



/* =====================================================
   BOOKING ID
===================================================== */

function getBookingId(booking) {

    if (
        booking.id !== undefined &&
        booking.id !== null
    ) {

        return String(booking.id);

    }


    return [

        booking.created_at || "",

        booking.name || "",

        booking.phone || "",

        booking.date || "",

        booking.time || ""

    ].join("|");

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(time) {

    if (!time) {

        return "-";

    }


    const parts =
        String(time).split(":");


    if (parts.length < 2) {

        return time;

    }


    let hour =
        parseInt(parts[0], 10);


    const minute =
        parts[1];


    if (isNaN(hour)) {

        return time;

    }


    const ampm =
        hour >= 12
            ? "PM"
            : "AM";


    hour =
        hour % 12 || 12;


    return `${hour}:${minute} ${ampm}`;

}



/* =====================================================
   FORMAT CREATED DATE
===================================================== */

function formatCreatedDate(createdAt) {

    if (!createdAt) {

        return "";

    }


    try {

        return new Date(createdAt)
            .toLocaleString(
                "en-AE",
                {
                    timeZone: "Asia/Dubai"
                }
            );

    }

    catch {

        return createdAt;

    }

}



/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    const message =
        document.getElementById(
            "loginMessage"
        );


    if (!email || !password) {

        message.className =
            "login-error";

        message.innerText =
            "Please enter email and password.";

        return;

    }


    message.className = "";

    message.innerText =
        "Logging in...";


    const {
        error
    } =
        await supabaseClient.auth
            .signInWithPassword({

                email: email,

                password: password

            });


    if (error) {

        message.className =
            "login-error";

        message.innerText =
            error.message;

        return;

    }


    message.innerText = "";


    showDashboard();


    await loadBookings();


    startPolling();

}



/* =====================================================
   SHOW DASHBOARD
===================================================== */

function showDashboard() {

    document.getElementById(
        "loginBox"
    ).style.display = "none";


    document.getElementById(
        "dashboard"
    ).style.display = "block";

}



/* =====================================================
   LOAD BOOKINGS
===================================================== */

async function loadBookings() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("alwan alward")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);


        document.getElementById(
            "bookings"
        ).innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    Could not load bookings
                </h3>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;

        return;

    }


    allBookings =
        data || [];


    processNewBookings();

    updateStatistics();

    renderBookings();

}



/* =====================================================
   UPDATE STATISTICS
===================================================== */

function updateStatistics() {


    /* TOTAL */

    document.getElementById(
        "totalBookings"
    ).innerText =
        allBookings.length;



    /* UAE TODAY */

    const now =
        new Date();


    const parts =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone: "Asia/Dubai",

                year: "numeric",

                month: "2-digit",

                day: "2-digit"
            }
        ).formatToParts(now);


    const year =
        parts.find(
            p => p.type === "year"
        ).value;


    const month =
        parts.find(
            p => p.type === "month"
        ).value;


    const day =
        parts.find(
            p => p.type === "day"
        ).value;


    const today =
        `${year}-${month}-${day}`;



    /* TODAY COUNT */

    const todayCount =
        allBookings.filter(
            booking => {

                if (!booking.date) {

                    return false;

                }


                let date =
                    String(
                        booking.date
                    ).trim();


                if (
                    /^\d{4}-\d{2}-\d{2}$/
                        .test(date)
                ) {

                    return date === today;

                }


                if (
                    /^\d{4}-\d{2}-\d{2}/
                        .test(date)
                ) {

                    return (
                        date.substring(0, 10)
                        === today
                    );

                }


                if (
                    /^\d{2}\/\d{2}\/\d{4}$/
                        .test(date)
                ) {

                    const p =
                        date.split("/");


                    return (
                        `${p[2]}-${p[1]}-${p[0]}`
                        === today
                    );

                }


                if (
                    /^\d{2}-\d{2}-\d{4}$/
                        .test(date)
                ) {

                    const p =
                        date.split("-");


                    return (
                        `${p[2]}-${p[1]}-${p[0]}`
                        === today
                    );

                }


                return false;

            }
        ).length;


    document.getElementById(
        "todayBookings"
    ).innerText =
        todayCount;



    /* NEW */

    document.getElementById(
        "newBookings"
    ).innerText =
        newBookingIds.size;


    updateNewBookingsActionBar();

}



/* =====================================================
   NEW BOOKING BAR
===================================================== */

function updateNewBookingsActionBar() {

    const bar =
        document.getElementById(
            "newBookingsActions"
        );


    const message =
        document.getElementById(
            "newBookingsMessage"
        );


    const count =
        newBookingIds.size;


    if (count > 0) {

        bar.classList.add("show");


        if (count === 1) {

            message.innerText =
                "You have 1 new appointment request.";

        }

        else {

            message.innerText =
                `You have ${count} new appointment requests.`;

        }

    }

    else {

        bar.classList.remove("show");

    }

}



/* =====================================================
   PROCESS NEW BOOKINGS
===================================================== */

function processNewBookings() {

    const savedSeen =
        getSeenBookingIds();



    /* FIRST LOAD */

    if (firstLoad) {


        /*
           Keep the newest booking as NEW
           when there are no saved records.
        */

        if (
            savedSeen.size === 0 &&
            allBookings.length > 0
        ) {

            allBookings.forEach(
                (booking, index) => {

                    const id =
                        getBookingId(
                            booking
                        );


                    if (index > 0) {

                        savedSeen.add(id);

                    }

                }
            );


            saveSeenBookingIds(
                savedSeen
            );

        }



        allBookings.forEach(
            booking => {

                const id =
                    getBookingId(
                        booking
                    );


                knownBookingIds.add(id);


                if (!savedSeen.has(id)) {

                    newBookingIds.add(id);

                }

            }
        );


        firstLoad = false;


        if (newBookingIds.size > 0) {

            showLatestNotification();

        }


        return;

    }



    /* NORMAL POLLING */

    let newestBooking = null;


    allBookings.forEach(
        booking => {

            const id =
                getBookingId(
                    booking
                );


            if (
                !knownBookingIds.has(id)
            ) {

                knownBookingIds.add(id);


                if (!savedSeen.has(id)) {

                    newBookingIds.add(id);

                    newestBooking =
                        booking;

                }

            }

        }
    );



    if (newestBooking) {

        showNotification(
            newestBooking
        );

    }

}



/* =====================================================
   SHOW LATEST NOTIFICATION
===================================================== */

function showLatestNotification() {

    const newBookings =
        allBookings.filter(
            booking =>
                newBookingIds.has(
                    getBookingId(
                        booking
                    )
                )
        );


    if (
        newBookings.length === 0
    ) {

        return;

    }


    showNotification(
        newBookings[0]
    );

}



/* =====================================================
   SHOW NOTIFICATION
===================================================== */

function showNotification(booking) {

    const notification =
        document.getElementById(
            "notification"
        );


    const content =
        document.getElementById(
            "notificationContent"
        );


    const count =
        newBookingIds.size;


    const extra =
        count > 1
            ? `<br><strong>${count}</strong> new appointments waiting.`
            : "";


    content.innerHTML = `

        <strong>
            ${escapeHTML(
                booking.name ||
                "A customer"
            )}
        </strong>

        has requested an appointment.

        <br><br>

        📅
        <strong>
            Date:
        </strong>
        ${escapeHTML(
            booking.date || "-"
        )}

        <br>

        ⏰
        <strong>
            Time:
        </strong>
        ${formatTime(
            booking.time || "-"
        )}

        <br>

        💇‍♀️
        <strong>
            Service:
        </strong>
        ${escapeHTML(
            booking.service || "-"
        )}

        ${extra}

    `;


    notification.style.display =
        "block";

}



/* =====================================================
   CLOSE NOTIFICATION
===================================================== */

function closeNotification() {

    document.getElementById(
        "notification"
    ).style.display =
        "none";

}



/* =====================================================
   MARK ALL SEEN
===================================================== */

function markAllSeen() {

    const savedSeen =
        getSeenBookingIds();


    newBookingIds.forEach(
        id => {

            savedSeen.add(id);

        }
    );


    saveSeenBookingIds(
        savedSeen
    );


    newBookingIds.clear();


    updateStatistics();

    closeNotification();

    renderBookings();

}



/* =====================================================
   VIEW NEW
===================================================== */

function viewNewBookings() {

    closeNotification();


    const firstNew =
        document.querySelector(
            ".booking.new"
        );


    if (firstNew) {

        firstNew.scrollIntoView({

            behavior: "smooth",

            block: "center"

        });

    }

}



/* =====================================================
   RENDER BOOKINGS
===================================================== */

function renderBookings() {

    const container =
        document.getElementById(
            "bookings"
        );


    if (
        !allBookings ||
        allBookings.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📅
                </div>

                <h3>
                    No appointments yet
                </h3>

                <p>
                    New customer bookings will appear here.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML = "";



    allBookings.forEach(
        booking => {


            const id =
                getBookingId(
                    booking
                );


            const isNew =
                newBookingIds.has(id);



            /* PHONE */

            let customerPhone =
                String(
                    booking.phone || ""
                ).replace(
                    /\D/g,
                    ""
                );


            if (
                customerPhone.startsWith("0") &&
                customerPhone.length === 10
            ) {

                customerPhone =
                    "971" +
                    customerPhone.substring(1);

            }



            /* WHATSAPP */

            const confirmMessage =
                `✅ Your appointment has been confirmed! Thank you for choosing Alwan Alward Ladies Salon. 💜 We look forward to seeing you. ✨`;


            const rejectMessage =
                `We are sorry, but your appointment request could not be confirmed at this time. 💜 Please contact Alwan Alward Ladies Salon on WhatsApp to choose another available time. Thank you for understanding. ✨`;


            const confirmURL =
                customerPhone
                    ? "https://wa.me/" +
                      customerPhone +
                      "?text=" +
                      encodeURIComponent(
                          confirmMessage
                      )
                    : "#";


            const rejectURL =
                customerPhone
                    ? "https://wa.me/" +
                      customerPhone +
                      "?text=" +
                      encodeURIComponent(
                          rejectMessage
                      )
                    : "#";



            /* CARD */

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "booking" +
                (
                    isNew
                        ? " new"
                        : ""
                );



            card.innerHTML = `

                ${
                    isNew
                        ? `
                            <div class="new-label">
                                NEW
                            </div>
                          `
                        : ""
                }


                <h3 class="customer-name">

                    💇‍♀️

                    ${escapeHTML(
                        booking.name ||
                        "Customer"
                    )}

                </h3>


                <div class="booking-info">


                    <div class="info-item">

                        <strong>
                            Phone
                        </strong>

                        <span>
                            ${escapeHTML(
                                booking.phone ||
                                "-"
                            )}
                        </span>

                    </div>



                    <div class="info-item">

                        <strong>
                            Service
                        </strong>

                        <span>
                            ${escapeHTML(
                                booking.service ||
                                "-"
                            )}
                        </span>

                    </div>



                    <div class="info-item">

                        <strong>
                            Date
                        </strong>

                        <span>
                            ${escapeHTML(
                                booking.date ||
                                "-"
                            )}
                        </span>

                    </div>



                    <div class="info-item">

                        <strong>
                            Time
                        </strong>

                        <span>
                            ${formatTime(
                                booking.time ||
                                "-"
                            )}
                        </span>

                    </div>


                </div>



                <div class="booking-note">

                    <strong>
                        💬 Additional Note
                    </strong>

                    <br>

                    ${
                        booking.note
                            ? escapeHTML(
                                booking.note
                              )
                            : "No additional note"
                    }

                </div>



                <div class="booking-created">

                    Booking received:

                    ${formatCreatedDate(
                        booking.created_at
                    )}

                </div>



                <div class="booking-actions">


                    <a
                        href="${confirmURL}"

                        ${
                            customerPhone
                                ? `
                                    target="_blank"
                                    rel="noopener noreferrer"
                                  `
                                : ""
                        }

                        class="confirm-button"

                        ${
                            !customerPhone
                                ? `onclick="return false;"`
                                : ""
                        }
                    >

                        💬 Confirm Booking

                    </a>



                    <a
                        href="${rejectURL}"

                        ${
                            customerPhone
                                ? `
                                    target="_blank"
                                    rel="noopener noreferrer"
                                  `
                                : ""
                        }

                        class="reject-button"

                        ${
                            !customerPhone
                                ? `onclick="return false;"`
                                : ""
                        }
                    >

                        ✕ Reject Booking

                    </a>


                </div>



                ${
                    !customerPhone
                        ? `
                            <p
                                style="
                                    color:#c0392b;
                                    font-size:12px;
                                    margin-top:10px;
                                "
                            >
                                ⚠️ No valid customer phone number.
                            </p>
                          `
                        : ""
                }

            `;


            container.appendChild(card);

        }
    );

}



/* =====================================================
   POLLING
===================================================== */

function startPolling() {

    if (pollingTimer) {

        clearInterval(
            pollingTimer
        );

    }


    pollingTimer =
        setInterval(
            async function() {

                await loadBookings();

            },
            5000
        );

}



/* =====================================================
   MANUAL REFRESH
===================================================== */

async function manualRefresh() {

    const button =
        document.querySelector(
            ".refresh-button"
        );


    const oldText =
        button.innerText;


    button.innerText =
        "Loading...";


    button.disabled = true;


    await loadBookings();


    button.innerText =
        oldText;


    button.disabled = false;

}



/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

    if (pollingTimer) {

        clearInterval(
            pollingTimer
        );

        pollingTimer = null;

    }


    await supabaseClient.auth
        .signOut();


    document.getElementById(
        "dashboard"
    ).style.display =
        "none";


    document.getElementById(
        "loginBox"
    ).style.display =
        "flex";


    document.getElementById(
        "password"
    ).value = "";

}



/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkLogin() {

    const {
        data,
        error
    } =
        await supabaseClient.auth
            .getSession();


    if (error) {

        console.error(error);

        return;

    }


    if (data.session) {

        showDashboard();

        await loadBookings();

        startPolling();

    }

}



/* =====================================================
   ENTER KEY LOGIN
===================================================== */

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                login();

            }

        }
    );



/* =====================================================
   START
===================================================== */

checkLogin();


</script>
